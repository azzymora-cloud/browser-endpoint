map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 100m;

    location /session-hud/ {
        alias /usr/share/nginx/html/session-hud/;
        add_header Cache-Control "no-store";
    }

    # Only the session HUD kill-switch. Do not proxy the rest of the agent.
    location /host-agent/ {
        limit_except GET POST { deny all; }
        proxy_pass http://host.docker.internal:18765/api/hud/;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Length $content_length;
        proxy_read_timeout 20s;
    }

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;

        # sub_filter cannot rewrite gzip HTML.
        proxy_set_header Accept-Encoding "";
        sub_filter '</body>' '<script src="/session-hud/hud.js" defer></script></body>';
        sub_filter_once on;
    }
}
