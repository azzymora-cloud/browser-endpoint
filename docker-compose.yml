name: thinkcentre

# Guacamole, guacd, and (optionally) cloudflared share Postgres's network
# namespace and talk on 127.0.0.1. That avoids a Docker bridge between them
# and keeps RDP/VNC on the Windows host as the only off-box hop
# (host.docker.internal).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guacamole}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-guacamole_db}
    volumes:
      - ./guacamole/init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${GUACAMOLE_BIND:-127.0.0.1}:${GUACAMOLE_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guacamole} -d ${POSTGRES_DB:-guacamole_db}"]
      interval: 5s
      timeout: 5s
      retries: 12

  guacd:
    image: guacamole/guacd:1.6.0
    restart: unless-stopped
    network_mode: service:postgres
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - drive:/drive
      - record:/var/lib/guacamole/recordings

  guacamole:
    image: guacamole/guacamole:1.6.0
    restart: unless-stopped
    network_mode: service:postgres
    depends_on:
      postgres:
        condition: service_healthy
      guacd:
        condition: service_started
    environment:
      GUACD_HOSTNAME: 127.0.0.1
      GUACD_PORT: 4822
      POSTGRESQL_HOSTNAME: 127.0.0.1
      POSTGRESQL_DATABASE: ${POSTGRES_DB:-guacamole_db}
      POSTGRESQL_USERNAME: ${POSTGRES_USER:-guacamole}
      POSTGRESQL_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      WEBAPP_CONTEXT: ROOT
    volumes:
      # After Tomcat generates CATALINA_BASE, move it to 8081 so nginx can own 8080.
      - ./guacamole/entrypoint.d/550-listen-8081.sh:/opt/guacamole/entrypoint.d/550-listen-8081.sh:ro

  hud:
    image: nginx:1.27-alpine
    restart: unless-stopped
    network_mode: service:postgres
    depends_on:
      guacamole:
        condition: service_started
    volumes:
      - ./guacamole/hud/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./guacamole/hud/static:/usr/share/nginx/html/session-hud:ro

volumes:
  postgres_data:
  drive:
  record:
